name: Enforce merge chain
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, staging]

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          echo "Base: ${{ github.base_ref }}"
          echo "Head: ${{ github.head_ref }}"

          if [ "${{ github.base_ref }}" = "main" ] && [ "${{ github.head_ref }}" != "staging" ]; then
            echo "❌ PRs into main must come from staging."
            exit 1
          fi

          if [ "${{ github.base_ref }}" = "staging" ] && [ "${{ github.head_ref }}" != "develop" ]; then
            echo "❌ PRs into staging must come from develop."
            exit 1
          fi

          echo "✅ Merge chain OK."
